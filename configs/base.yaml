# LPMConfig defaults (lpm/config.py), mirrored 1:1.
# E0 2026-08-13 (GPT-2, 4 LoRA experts, 800 steps): overall median Mirsky
# ratio 0.028 < 0.3 → gains OFF. Full table: docs/reports/e0-mirsky.md
base_model: gpt2
enable_gains: false
tie_qk_across_heads: false
field_init_sigma: 0.001
lambda_h: 0.1
lambda_reg: 0.0001
lambda_geo: 1.0
lambda_task: 1.0
refine_steps: 0
refine_lr: 0.001
optimizer:
  lr: 0.001
  weight_decay: 0.0
  betas: [0.9, 0.999]
  grad_clip: 1.0
  steps: 2000
  warmup_steps: 50
  schedule: cosine
  batch_size: 8
data: {}
