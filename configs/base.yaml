# LPMConfig defaults (lpm/config.py), mirrored 1:1. enable_gains is decided by
# E0 (scripts/audit_mirsky.py, spec §10) and recorded here — see docs/reports.
base_model: gpt2
enable_gains: false
tie_qk_across_heads: false
field_init_sigma: 0.001
lambda_h: 0.1
lambda_reg: 0.0001
lambda_geo: 1.0
lambda_task: 1.0
refine_steps: 0
refine_lr: 0.001
optimizer:
  lr: 0.001
  weight_decay: 0.0
  betas: [0.9, 0.999]
  grad_clip: 1.0
  steps: 2000
  warmup_steps: 50
  schedule: cosine
  batch_size: 8
data: {}
