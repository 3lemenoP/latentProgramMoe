# B4 — natural-language style skill on Pythia-410m, with/without the axis
# field (steering-workstreams-a-b.md B4). E1 protocol otherwise (lambda_reg
# kept at the E1 value for cross-scale comparability; note it biases all
# sites toward identity equally).
base_model: EleutherAI/pythia-410m
enable_gains: false
tie_qk_across_heads: false
field_init_sigma: 0.001
lambda_h: 0.1
lambda_reg: 0.0001
lambda_geo: 1.0
lambda_task: 1.0
refine_steps: 0
refine_lr: 0.001
optimizer:
  lr: 0.001
  weight_decay: 0.0
  betas: [0.9, 0.999]
  grad_clip: 1.0
  steps: 2000
  warmup_steps: 50
  schedule: cosine
  batch_size: 8
data:
  experts_dir: experts-pythia
  out_dir: runs/b4
