# E3 — order sensitivity falsifier (spec §10): from-scratch synthetic base;
# base_model is ignored (the script builds its own tiny GPT-2).
base_model: gpt2
enable_gains: false
tie_qk_across_heads: false
field_init_sigma: 0.001
lambda_h: 0.0
lambda_reg: 0.0
lambda_geo: 1.0
lambda_task: 1.0
refine_steps: 0
refine_lr: 0.001
optimizer:
  lr: 0.001
  weight_decay: 0.0
  betas: [0.9, 0.999]
  grad_clip: 1.0
  steps: 1500
  warmup_steps: 50
  schedule: cosine
  batch_size: 64
data: {}
